general {
    lock_cmd = ~/.local/bin/yorha-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.local/bin/yorha-idle-display on
    ignore_dbus_inhibit = false
}
listener {
    timeout = 300
    on-timeout = ~/.local/bin/yorha-standby start --idle
    on-resume = ~/.local/bin/yorha-standby stop
}
listener {
    timeout = 600
    on-timeout = ~/.local/bin/yorha-lock --idle
}
listener {
    timeout = 630
    on-timeout = ~/.local/bin/yorha-idle-display off
    on-resume = ~/.local/bin/yorha-idle-display on
}
