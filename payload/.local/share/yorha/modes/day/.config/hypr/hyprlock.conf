$font = Noto Sans
general {
    hide_cursor = true
}
background {
    monitor =
    color = rgb(d4d0b8)
}
label {
    monitor =
    text = ■  YoRHa : ACCESS CONTROL
    color = rgb(454438)
    font_size = 24
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(454438)
    font_size = 80
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 440, 56
    outline_thickness = 2
    inner_color = rgb(e5e1cb)
    outer_color = rgb(454438)
    check_color = rgb(5b594b)
    fail_color = rgb(87503e)
    font_color = rgb(454438)
    font_family = $font
    fade_on_empty = false
    rounding = 0
    placeholder_text = Authenticate to resume operations
    fail_text = Access denied. Try again.
    dots_size = 0.2
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
