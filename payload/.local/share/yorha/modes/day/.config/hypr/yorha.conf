# YoRHa visual layer — sourced last; hardware and bindings live in UserConfigs.
$yorha_bg = rgb(d4d0b8)
$yorha_ink = rgb(454438)
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    col.active_border = rgb(454438)
    col.inactive_border = rgb(aaa58e)
}
decoration {
    rounding = 0
    active_opacity = 1
    inactive_opacity = 1
    dim_inactive = false
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}
animations {
    enabled = true
    bezier = yorhaEase, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, yorhaEase, slide
    animation = windowsOut, 1, 2, yorhaEase, slide
    animation = fade, 1, 2, default
    animation = workspaces, 1, 3, yorhaEase, slide
    animation = border, 0
}

